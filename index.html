<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday 💗</title>
  <style>
    :root { --pink:#ff6fae; --deep:#a83268; --pale:#fff0f6; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family: Georgia, "Times New Roman", serif;
      color:#702747; background:radial-gradient(circle at top,#fffafd,#ffe0ed 55%,#ffc4dc);
      overflow-x:hidden;
    }
    .wrap { min-height:100vh; display:grid; place-items:center; padding:24px 14px; }
    .card {
      width:min(100%,520px); padding:30px 22px; text-align:center;
      background:rgba(255,255,255,.78); border:1px solid rgba(255,255,255,.9);
      border-radius:28px; box-shadow:0 18px 55px rgba(168,50,104,.16);
      backdrop-filter:blur(8px); position:relative; z-index:1;
    }
    .tiny { letter-spacing:3px; text-transform:uppercase; font:600 11px Arial,sans-serif; color:#c05283; }
    h1 { font-size:clamp(34px,9vw,52px); line-height:1.05; margin:14px 0; color:var(--deep); }
    .subtitle { font:15px/1.6 Arial,sans-serif; color:#92506d; }
    .gift { font-size:76px; margin:20px 0 10px; animation:bob 2s ease-in-out infinite; }
    button {
      border:0; border-radius:999px; padding:14px 21px; margin:8px 4px; cursor:pointer;
      font:600 14px Arial,sans-serif; background:var(--pink); color:white;
      box-shadow:0 8px 18px rgba(255,111,174,.28); transition:transform .2s;
    }
    button:hover { transform:translateY(-2px); }
    button.secondary { color:#a83268; background:#ffe1ee; box-shadow:none; }
    .letter {
      display:none; margin-top:22px; padding:22px 18px; text-align:left; white-space:pre-line;
      font:15px/1.8 Arial,sans-serif; background:#fff7fb; border:1px solid #ffd5e6; border-radius:18px;
      animation:appear .65s ease both;
    }
    .letter h2 { margin:0 0 12px; font: bold 25px Georgia,serif; text-align:center; color:var(--deep); }
    .signature { text-align:right; color:#c05283; font-style:italic; }
    .music-note { font:12px/1.5 Arial,sans-serif; color:#9b6079; margin-top:10px; }
    .heart { position:fixed; bottom:-35px; z-index:0; pointer-events:none; animation:floatUp linear forwards; opacity:.75; }
    .hidden-audio { display:none; }
    @keyframes bob { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-8px) rotate(3deg)} }
    @keyframes appear { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes floatUp { to { transform:translateY(-115vh) rotate(35deg); opacity:0; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition:none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="tiny">a little surprise for you</div>
      <h1>Happy Birthday,<br><span id="recipient">My Favorite Person</span> 💗</h1>
      <p class="subtitle">Ada sesuatu yang spesial buat kamu.<br>Siap buka kejutan kecil ini?</p>
      <div class="gift" aria-hidden="true">🎁</div>
      <button id="surpriseBtn">Buka Kejutan 💌</button>
      <div id="letter" class="letter" aria-live="polite">
        <h2>Untuk kamu, di hari spesialmu ♡</h2>
        <div id="letterText"></div>
        <p class="signature">With love, <span id="sender">someone who cares</span> ♡</p>
      </div>
      <div>
        <button id="musicBtn" class="secondary" hidden>⏸ Pause lagu</button>
      </div>
      <p class="music-note" id="musicStatus">Musik akan dimulai saat kejutan dibuka. Tambahkan file musikmu di kode agar bisa diputar.</p>
    </section>
  </main>

  <!-- Letakkan file musik legal milikmu bernama lagu.mp3 di folder yang sama.
       Jika tidak ada file itu, website tetap berjalan tetapi musik tidak tersedia. -->
  <audio id="birthdayMusic" preload="none" loop>
    <source src="lagu.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ✨ UBAH BAGIAN INI SESUAI KEINGINANMU
    const recipientName = "My Favorite Person";
    const senderName = "someone who cares";
    const birthdayMessage = `Happy birthday yaaa! 🎂💗

Semoga di umur yang baru ini kamu selalu diberi kesehatan, kebahagiaan, dan banyak hal baik. Semoga apa pun yang sedang kamu usahakan satu per satu bisa tercapai.

Terima kasih sudah menjadi seseorang yang spesial. Jangan lupa untuk tetap sayang sama diri sendiri, istirahat kalau capek, dan ingat kalau kamu pantas mendapatkan hal-hal baik.

Hari ini adalah hari kamu, jadi semoga banyak alasan untuk tersenyum. Have the happiest birthday! 🫶🏻✨`;

    const recipient = document.getElementById("recipient");
    const sender = document.getElementById("sender");
    const letterText = document.getElementById("letterText");
    const letter = document.getElementById("letter");
    const surpriseBtn = document.getElementById("surpriseBtn");
    const musicBtn = document.getElementById("musicBtn");
    const music = document.getElementById("birthdayMusic");
    const musicStatus = document.getElementById("musicStatus");

    recipient.textContent = recipientName;
    sender.textContent = senderName;
    letterText.textContent = birthdayMessage;

    let opened = false;
    surpriseBtn.addEventListener("click", async () => {
      letter.style.display = "block";
      surpriseBtn.textContent = "Kejutannya sudah terbuka 💖";
      surpriseBtn.disabled = true;
      opened = true;
      burstHearts(18);

      try {
        music.volume = 0.65;
        await music.play();
        musicBtn.hidden = false;
        musicBtn.textContent = "⏸ Pause lagu";
        musicStatus.textContent = "Lagu sedang diputar 🎶";
      } catch (error) {
        musicStatus.textContent = "Suratnya sudah terbuka 💗 Untuk musik, tambahkan file lagu.mp3 yang legal ke folder website lalu buka ulang halaman.";
      }
    });

    musicBtn.addEventListener("click", async () => {
      if (music.paused) {
        try {
          await music.play();
          musicBtn.textContent = "⏸ Pause lagu";
          musicStatus.textContent = "Lagu sedang diputar 🎶";
        } catch (error) {
          musicStatus.textContent = "Musik belum bisa diputar. Pastikan file lagu.mp3 tersedia.";
        }
      } else {
        music.pause();
        musicBtn.textContent = "▶ Play lagu";
        musicStatus.textContent = "Lagu dijeda.";
      }
    });

    function burstHearts(count) {
      const symbols = ["💗","💕","💖","♡","✨"];
      for (let i = 0; i < count; i++) {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (16 + Math.random() * 20) + "px";
        heart.style.animationDuration = (4 + Math.random() * 4) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 8500);
      }
    }
    // Hati kecil bergerak pelan setelah halaman dibuka.
    setInterval(() => {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = Math.random() > .4 ? "♡" : "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 15) + "px";
      heart.style.animationDuration = (7 + Math.random() * 5) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 12500);
    }, 950);
  </script>
</body>
</html>
